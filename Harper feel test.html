<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harper feel test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #fdfdfc; --text: #34322d; --muted: #8b8980; --line: #ecebe6;
    --err: #de5a50; --fix: 112, 196, 140;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #151418; --text: #e6e4ea; --muted: #8e8c96; --line: #26252b;
      --err: #ef7a70; --fix: 96, 190, 128;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #151418; --text: #e6e4ea; --muted: #8e8c96; --line: #26252b;
    --err: #ef7a70; --fix: 96, 190, 128;
  }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Noto Serif KR", "Source Han Serif KR", Georgia, serif;
    display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 680px; padding: 12vh 1.25rem 4rem; box-sizing: border-box; }
  .field { position: relative; border-bottom: 1px solid var(--line); padding-bottom: 1rem; }
  .field:focus-within { border-bottom-color: var(--muted); }
  .mirror, textarea {
    font: 400 1.25rem/1.85 "Noto Serif KR", "Source Han Serif KR", Georgia, serif;
    letter-spacing: 0; margin: 0; padding: 0; border: 0;
    white-space: pre-wrap; overflow-wrap: break-word; word-break: normal;
    box-sizing: border-box; width: 100%;
  }
  .mirror { position: absolute; inset: 0; color: var(--text); pointer-events: none; }
  textarea {
    position: relative; display: block; min-height: 38vh; resize: none; overflow: hidden;
    background: transparent; color: transparent; caret-color: var(--text); outline: none;
  }
  textarea::placeholder { color: var(--muted); }
  textarea::selection { background: rgba(142, 200, 250, .35); }
  .err {
    text-decoration: underline wavy var(--err); text-decoration-thickness: 1.5px;
    text-underline-offset: 5px;
  }
  .fix {
    border-radius: 3px;
    animation: fade 1.8s cubic-bezier(.2,.6,.3,1) both;
  }
  @keyframes fade {
    0%   { background: rgba(var(--fix), .55); }
    35%  { background: rgba(var(--fix), .45); }
    100% { background: rgba(var(--fix), 0); }
  }
  .status { margin-top: .9rem; font-size: .8125rem; color: var(--muted); min-height: 1.2em; }
  @media (prefers-reduced-motion: reduce) { .fix { animation-duration: .01s; } }
</style>
</head>
<body>
<main>
  <div class="field">
    <div class="mirror" id="mirror" aria-hidden="true"></div>
    <textarea id="ta" spellcheck="false" autocomplete="off" autocapitalize="off" autofocus
      placeholder="Start typing. Try: teh, recieve, definately, a apple, the the, i think"></textarea>
  </div>
  <div class="status" id="status">Loading Harper…</div>
</main>

<script type="module">
const ta = document.getElementById("ta");
const mirror = document.getElementById("mirror");
const statusEl = document.getElementById("status");

const HOLD_MS = 550;     // how long the red underline shows before the fix
const FADE_MS = 1800;    // green highlight fade time
const ALLOWED = ["Spelling", "Grammar", "Capitalization", "Typo", "Repetition", "Agreement"];

/* ---------- checkers: both return [{s, e, repl}] ---------- */
let checker = null;

async function loadHarper() {
  const mod = await Promise.race([
    import("https://cdn.jsdelivr.net/npm/harper.js@0.40.0/+esm"),
    new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 9000))
  ]);
  const linter = new mod.LocalLinter({ binary: mod.binary || mod.binaryInlined, dialect: mod.Dialect && mod.Dialect.American });
  await linter.setup();
  await linter.lint("Warm up.");
  return async (text) => {
    const out = [];
    for (const l of await linter.lint(text)) {
      let kind = "";
      try { kind = String(l.lint_kind()); } catch (e) {}
      if (kind && !ALLOWED.some(k => kind.indexOf(k) === 0)) continue;
      if (!l.suggestion_count || l.suggestion_count() === 0) continue;
      const sg = l.suggestions()[0], sp = l.span();
      const k = sg.kind();
      if (k !== 0 && k !== 1) continue;                    // replace or remove only
      out.push({ s: sp.start, e: sp.end, repl: k === 1 ? "" : sg.get_replacement_text() });
    }
    return out;
  };
}

const TYPOS = { teh: "the", recieve: "receive", definately: "definitely", alot: "a lot", seperate: "separate",
  wich: "which", becuase: "because", adress: "address", occured: "occurred", untill: "until", thier: "their",
  freind: "friend", wierd: "weird", tommorow: "tomorrow", beleive: "believe", goverment: "government" };
const VOWELISH = "apple|example|idea|answer|error|issue|interesting|important|easy|hour|email|image|option";

function fallbackCheck(text) {
  const out = [];
  let m;
  const word = /[A-Za-z']+/g;
  while ((m = word.exec(text))) {
    const w = m[0], low = w.toLowerCase();
    if (TYPOS[low]) {
      let r = TYPOS[low];
      if (w[0] !== low[0]) r = r[0].toUpperCase() + r.slice(1);
      out.push({ s: m.index, e: m.index + w.length, repl: r });
    } else if (w === "i") out.push({ s: m.index, e: m.index + 1, repl: "I" });
  }
  const dbl = /\b([A-Za-z]+) \1\b/gi;
  while ((m = dbl.exec(text))) out.push({ s: m.index + m[1].length, e: m.index + m[0].length, repl: "" });
  const art = new RegExp("\\b(a) (?=(?:" + VOWELISH + ")\\b)", "gi");
  while ((m = art.exec(text))) out.push({ s: m.index, e: m.index + 1, repl: m[1] === "A" ? "An" : "an" });
  return out;
}

(async () => {
  try {
    const run = await loadHarper();
    checker = run;
    statusEl.textContent = "Checker: Harper (WebAssembly, runs in your browser)";
  } catch (err) {
    checker = async (t) => fallbackCheck(t);
    statusEl.textContent = "Checker: small built-in fallback. Harper could not load inside this page.";
  }
  schedule();
})();

/* ---------- state ---------- */
let text = "", marks = [], uid = 0, ver = 0, timer = null;

const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

function render() {
  const now = performance.now();
  const ms = marks.filter(m => m.e > m.s && m.e <= text.length).sort((a, b) => a.s - b.s);
  let out = "", pos = 0;
  for (const m of ms) {
    if (m.s < pos) continue;
    out += esc(text.slice(pos, m.s));
    const seg = esc(text.slice(m.s, m.e));
    out += m.type === "err"
      ? '<span class="err">' + seg + "</span>"
      : '<span class="fix" style="animation-delay:-' + Math.round(now - m.t) + 'ms">' + seg + "</span>";
    pos = m.e;
  }
  mirror.innerHTML = out + esc(text.slice(pos)) + "\u200b";
  ta.style.height = "auto";
  ta.style.height = ta.scrollHeight + "px";
}

/* keep mark positions valid after any edit (prefix/suffix diff) */
function shiftMarks(oldT, newT) {
  let p = 0;
  const max = Math.min(oldT.length, newT.length);
  while (p < max && oldT[p] === newT[p]) p++;
  let q = 0;
  while (q < max - p && oldT[oldT.length - 1 - q] === newT[newT.length - 1 - q]) q++;
  const oldEnd = oldT.length - q, delta = newT.length - oldT.length;
  marks = marks.filter(m => {
    if (m.e <= p) return true;
    if (m.s >= oldEnd) { m.s += delta; m.e += delta; return true; }
    return false;
  });
}

function applyFix(m) {
  if (marks.indexOf(m) < 0 || ta.value.slice(m.s, m.e) !== m.orig) { marks = marks.filter(x => x !== m); render(); return; }
  const a = ta.selectionStart, b = ta.selectionEnd;
  const delta = m.repl.length - (m.e - m.s);
  ta.setRangeText(m.repl, m.s, m.e, "preserve");
  ta.setSelectionRange(a >= m.e ? a + delta : a, b >= m.e ? b + delta : b);
  text = ta.value;
  for (const x of marks) if (x !== m && x.s >= m.e) { x.s += delta; x.e += delta; }
  if (m.repl === "") {
    marks = marks.filter(x => x !== m);
  } else {
    m.type = "fix"; m.e = m.s + m.repl.length; m.t = performance.now();
    setTimeout(() => { marks = marks.filter(x => x !== m); render(); }, FADE_MS + 100);
  }
  render();
  schedule();
}

async function lintNow() {
  if (!checker) return;
  const v = ++ver, snapshot = text;
  const found = await checker(snapshot);
  if (v !== ver || snapshot !== text) return;
  const caret = ta.selectionStart;
  for (const f of found) {
    if (caret <= f.e) continue;                                  // still typing this word
    if (marks.some(m => m.type === "err" && m.s === f.s && m.e === f.e)) continue;
    const m = { id: ++uid, type: "err", s: f.s, e: f.e, repl: f.repl, orig: snapshot.slice(f.s, f.e) };
    marks.push(m);
    setTimeout(() => applyFix(m), HOLD_MS);
  }
  render();
}

function schedule() { clearTimeout(timer); timer = setTimeout(lintNow, 140); }

ta.addEventListener("input", () => {
  const old = text;
  text = ta.value;
  shiftMarks(old, text);
  render();
  schedule();
});
render();
</script>
</body>
</html>
