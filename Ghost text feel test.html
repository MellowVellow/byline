<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ghost text feel test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg:#fdfdfc; --text:#34322d; --muted:#8b8980; --ghost:#b4b2aa; --line:#ecebe6;
    --conn:140,110,230; --ok:112,196,140;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme:dark; --bg:#151418; --text:#e6e4ea; --muted:#8e8c96; --ghost:#5f5d68; --line:#26252b;
      --conn:170,145,250;
    }
  }
  :root[data-theme="dark"] {
    color-scheme:dark; --bg:#151418; --text:#e6e4ea; --muted:#8e8c96; --ghost:#5f5d68; --line:#26252b;
    --conn:170,145,250;
  }
  html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:var(--text);font-family:"Noto Serif KR","Source Han Serif KR",Georgia,serif;display:flex;justify-content:center}
  main{width:100%;max-width:700px;padding:9vh 1.25rem 4rem;box-sizing:border-box}
  .outline{width:100%;box-sizing:border-box;font:inherit;font-size:.875rem;line-height:1.6;color:var(--muted);
    background:none;border:0;border-bottom:1px solid var(--line);padding:0 0 .8rem;resize:none;outline:none;margin-bottom:1.6rem}
  .outline:focus{color:var(--text)}
  .field{position:relative;padding-bottom:1rem;border-bottom:1px solid var(--line)}
  .field:focus-within{border-bottom-color:var(--muted)}
  .mirror,.field textarea{font:400 1.25rem/1.85 "Noto Serif KR","Source Han Serif KR",Georgia,serif;margin:0;padding:0;border:0;
    white-space:pre-wrap;overflow-wrap:break-word;box-sizing:border-box;width:100%}
  .mirror{position:relative;min-height:34vh;pointer-events:none}
  .field textarea{position:absolute;inset:0;height:100%;resize:none;overflow:hidden;background:transparent;color:transparent;
    caret-color:var(--text);outline:none}
  .field textarea::placeholder{color:var(--muted)}
  .field textarea::selection{background:rgba(142,200,250,.35)}
  .ghost{color:var(--ghost);animation:in .25s ease-out both}
  @keyframes in{from{opacity:0}to{opacity:1}}
  .conn{background:rgba(var(--conn),.2);border-radius:3px;box-shadow:0 1px 0 rgba(var(--conn),.7)}
  .bar{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem;min-height:2rem}
  .bar button{font:inherit;font-size:.875rem;color:var(--text);background:none;border:1px solid var(--line);border-radius:999px;
    padding:.3rem .8rem;cursor:pointer}
  .bar button:hover{border-color:var(--muted)}
  .bar button:focus-visible,.hud input:focus-visible{outline:2px solid rgb(var(--conn));outline-offset:2px}
  .bar .why{align-self:center;font-size:.8125rem;color:var(--muted);margin-right:.25rem}
  .bar kbd{font:inherit;font-size:.75rem;color:var(--muted);margin-right:.4rem}
  .hud{margin-top:2rem;font-size:.8125rem;line-height:1.7;color:var(--muted)}
  .hud .row{display:flex;flex-wrap:wrap;gap:.4rem 1.4rem}
  .hud b{font-weight:500;color:var(--text)}
  .hud label{display:flex;align-items:center;gap:.5rem}
  .hud input{width:110px;accent-color:rgb(var(--conn))}
  @media (prefers-reduced-motion:reduce){.ghost{animation:none}}
</style>
</head>
<body>
<main>
  <textarea class="outline" id="outline" rows="3" spellcheck="false" aria-label="Outline">1. Cats suit small apartments
2. Dogs need more of your day
3. Which one fits a busy student</textarea>

  <div class="field">
    <div class="mirror" id="mirror" aria-hidden="true"></div>
    <textarea id="ta" spellcheck="false" autocomplete="off" autofocus
      placeholder="Write, then slow down or stop. Tab accepts ghost text, Esc dismisses."></textarea>
  </div>
  <div class="bar" id="bar" aria-live="polite"></div>

  <div class="hud" id="hud">
    <div class="row" id="signals"></div>
    <div class="row" style="margin-top:.6rem">
      <label>Slow-down <input id="slow" type="range" min="300" max="1500" step="50" value="700"><b id="slowV"></b></label>
      <label>Long pause <input id="long" type="range" min="1200" max="5000" step="100" value="2500"><b id="longV"></b></label>
    </div>
    <div id="note" style="margin-top:.6rem"></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const ta = $("ta"), mirror = $("mirror"), bar = $("bar"), outline = $("outline");

const CONN = {
  contrast: ["however","but","yet","still","nevertheless","on the other hand","although","whereas"],
  addition: ["also","moreover","furthermore","in addition","besides","likewise"],
  cause: ["therefore","thus","consequently","as a result","so","because","since"],
  sequence: ["then","next","afterwards","finally","first","second","meanwhile"],
  example: ["for example","for instance","in particular","such as"]
};
const ALL = []; for (const r in CONN) CONN[r].forEach(w => ALL.push({ w, r }));
ALL.sort((a, b) => b.w.length - a.w.length);
const CONN_RE = new RegExp("\\b(" + ALL.map(c => c.w.replace(/ /g, "\\s+")).join("|") + ")\\b", "gi");
const PHRASES = ["For example,", "In other words,", "That said,", "As a result,", "More importantly,"];
const DANGLING = new Set("the a an and but or of to in on because that which with for is are as so if when while".split(" "));

let slow = 700, long = 2500;
let lastKey = performance.now(), ver = 0, bursts = 0, sentIdx = 0;
let sug = { ghost: "", conn: [], opts: [], why: "" };
let fired = {}, abort = null, sample = null, lastMs = null, aiState = "checking";

/* ---------- Claude (sample capability) ---------- */
(async () => {
  try { sample = window.claude ? await window.claude.use("sample") : null; } catch (e) { sample = null; }
  aiState = sample ? "Claude" : "canned fallback";
  hud();
})();

async function ask(prompt, myVer) {
  if (!sample) return null;
  if (abort) abort.abort();
  abort = new AbortController();
  const t0 = performance.now();
  try {
    const r = await sample(prompt, { modelTier: "quick", cache: false, signal: abort.signal });
    if (myVer !== ver) return null;
    lastMs = Math.round(performance.now() - t0);
    return (r.text || "").trim();
  } catch (e) { aiState = "error (" + (e && e.code || "unknown") + "), canned fallback"; return null; }
}

/* ---------- signals (deterministic) ---------- */
function signals() {
  const t = ta.value, c = ta.selectionStart, before = t.slice(0, c);
  const atEnd = c === t.length && ta.selectionEnd === c;
  const complete = /[.!?…]["')\]]*\s*$/.test(before) || /\n\s*$/.test(before);
  const between = !atEnd && complete && t.slice(c).trim().length > 0;
  const zone = atEnd ? "end" : between ? "between" : "mid";
  const idx = (before.match(/[.!?…]+["')\]]*(\s|$)/g) || []).length;
  const last = (before.trim().split(/\s+/).pop() || "").toLowerCase().replace(/[^a-z']/g, "");
  const paras = t.split(/\n\n/); let acc = 0, para = "";
  for (const p of paras) { if (c <= acc + p.length) { para = p; break; } acc += p.length + 2; }
  const sentStart = Math.max(before.lastIndexOf(". "), before.lastIndexOf("? "), before.lastIndexOf("! "), before.lastIndexOf("\n")) + 1;
  return { t, c, before, zone, complete, idx, dangling: !complete && DANGLING.has(last), para, cur: before.slice(sentStart).trim() };
}

function sentences(t) {
  const out = [], re = /[^.!?…\n]+[.!?…]*["')\]]*\s*/g; let m;
  while ((m = re.exec(t))) out.push({ s: m.index, e: m.index + m[0].length });
  return out;
}

/* ---------- render ---------- */
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function render() {
  const t = ta.value; let out = "", pos = 0;
  for (const m of sug.conn.slice().sort((a, b) => a.s - b.s)) {
    out += esc(t.slice(pos, m.s)) + '<span class="conn">' + esc(t.slice(m.s, m.e)) + "</span>"; pos = m.e;
  }
  out += esc(t.slice(pos));
  if (sug.ghost) out += '<span class="ghost">' + esc(sug.ghost) + "</span>";
  mirror.innerHTML = out + "\u200b";
  bar.innerHTML = "";
  if (sug.opts.length) {
    const why = document.createElement("span"); why.className = "why"; why.textContent = sug.why; bar.appendChild(why);
    sug.opts.forEach((o, i) => {
      const b = document.createElement("button"); b.type = "button";
      b.innerHTML = "<kbd>Alt+" + (i + 1) + "</kbd>"; b.append(o.label);
      b.addEventListener("mousedown", e => e.preventDefault());
      b.addEventListener("click", () => pick(i));
      bar.appendChild(b);
    });
  }
}

function clearSug() { sug = { ghost: "", conn: [], opts: [], why: "" }; }
function touch() { lastKey = performance.now(); ver++; if (abort) abort.abort(); clearSug(); render(); }

/* ---------- triggers ---------- */
function joinGap(before, s) { return /\s$/.test(before) || !before || /^[\s,.;:!?]/.test(s) ? s : " " + s; }

async function ghostTrigger(s, myVer) {
  const prompt = "You are an inline writing autocomplete.\nOUTLINE:\n" + outline.value + "\n\nCURRENT PARAGRAPH:\n" + s.para +
    "\n\nCURSOR SENTENCE SO FAR: " + s.cur + "\n\n" + (s.complete
      ? "The sentence is complete. Write the next sentence (max 22 words) that fits the outline."
      : "Write only the words that finish this sentence (max 18 words), starting exactly where the text stops.") +
    "\nOutput the text only, no quotes, no explanation.";
  let g = await ask(prompt, myVer);
  if (myVer !== ver) return;
  if (!g) g = s.complete ? "That fits a busy week better than it first seems." : "and that matters more than most people expect.";
  g = g.replace(/^["“]|["”]$/g, "").split("\n")[0];
  sug.ghost = joinGap(s.before, s.complete ? " " + g : g); render(); hud();
}

function connTrigger(s) {
  const ss = sentences(s.t), c = s.c;
  const near = ss.filter(x => x.e === c || x.s === c || (x.s < c && x.e > c) || x.e <= c).slice(-1)
    .concat(ss.filter(x => x.s >= c).slice(0, 1));
  const found = [];
  for (const sen of near) {
    const seg = s.t.slice(sen.s, sen.e); let m; CONN_RE.lastIndex = 0;
    while ((m = CONN_RE.exec(seg))) found.push({ s: sen.s + m.index, e: sen.s + m.index + m[0].length });
  }
  sug.conn = found;
  if (!found.length) { sug.why = ""; render(); hud("No connective words in the sentences next to the cursor."); return; }
  const pickF = found.find(f => f.s >= c) || found[found.length - 1];
  const word = s.t.slice(pickF.s, pickF.e), key = word.toLowerCase().replace(/\s+/g, " ");
  const rel = ALL.find(x => x.w === key);
  sug.why = "Swap “" + word + "”";
  sug.opts = (rel ? CONN[rel.r] : []).filter(w => w !== key).slice(0, 5).map(w => ({
    label: w, apply: () => {
      const cap = /^[A-Z]/.test(word) ? w[0].toUpperCase() + w.slice(1) : w;
      ta.setRangeText(cap, pickF.s, pickF.e, "end");
    }
  }));
  render(); hud();
}

async function phraseTrigger(s, myVer) {
  const prompt = "A writer is stuck on one sentence. OUTLINE:\n" + outline.value + "\nPARAGRAPH:\n" + s.para +
    "\nSuggest 5 short connective phrases (2-4 words, ending with a comma) the writer could continue with. Return only a JSON array of strings.";
  const raw = await ask(prompt, myVer);
  if (myVer !== ver) return;
  let list = PHRASES;
  try { const m = raw && raw.match(/\[[\s\S]*\]/); if (m) { const a = JSON.parse(m[0]); if (a.length) list = a.slice(0, 5); } } catch (e) {}
  sug.why = "Stuck? Try a connective";
  sug.opts = list.map(p => ({ label: p, apply: () => { const ins = joinGap(ta.value, String(p)) + " "; ta.setRangeText(ins, ta.value.length, ta.value.length, "end"); } }));
  render(); hud();
}

function tick() {
  const idle = performance.now() - lastKey, s = signals();
  if (document.activeElement === ta && ta.value.trim().length > 8) {
    const key = ver + "|" + s.c;
    if (idle >= slow && s.zone === "end" && !fired.g && key) { fired.g = key; ghostTrigger(s, ver); }
    if (idle >= long && s.zone === "between" && !fired.c) { fired.c = key; connTrigger(s); }
    if (idle >= long && s.zone === "end" && !s.complete && bursts >= 3 && !fired.p) { fired.p = key; phraseTrigger(s, ver); }
  }
  hud(null, idle, s);
}

/* ---------- accept ---------- */
function pick(i) {
  const o = sug.opts[i]; if (!o) return;
  o.apply(); ta.dispatchEvent(new Event("input")); ta.focus();
}
function acceptGhost() {
  const g = sug.ghost; if (!g) return false;
  ta.setRangeText(g, ta.value.length, ta.value.length, "end"); ta.dispatchEvent(new Event("input")); return true;
}

ta.addEventListener("input", () => {
  const now = performance.now(), s = signals();
  if (s.idx !== sentIdx) { sentIdx = s.idx; bursts = 1; } else if (now - lastKey >= slow) bursts++;
  else if (bursts === 0) bursts = 1;
  fired = {}; touch();
});
ta.addEventListener("keydown", e => {
  if (e.key === "Tab" && !e.shiftKey && (sug.ghost || sug.opts.length)) { e.preventDefault(); if (!acceptGhost()) pick(0); }
  else if (e.key === "Escape") { clearSug(); render(); }
  else if (e.altKey && /^Digit[1-5]$/.test(e.code)) { e.preventDefault(); pick(+e.code.slice(5) - 1); }
});
function moved() { fired = {}; if (document.activeElement === ta) { bursts = 0; sentIdx = signals().idx; touch(); } }
ta.addEventListener("click", moved);
ta.addEventListener("keyup", e => { if (/^(Arrow|Home|End|Page)/.test(e.key)) moved(); });
ta.addEventListener("focus", () => { lastKey = performance.now(); });

/* ---------- HUD ---------- */
let noteText = "";
function hud(note, idle, s) {
  if (note !== undefined && note !== null) noteText = note;
  s = s || signals(); idle = idle === undefined ? performance.now() - lastKey : idle;
  const state = s.complete ? "complete" : s.dangling ? "open (ends on a function word)" : "open";
  const stage = idle >= long ? "long pause" : idle >= slow ? "slow-down" : "typing";
  $("signals").innerHTML =
    "<span>Caret <b>" + s.zone + "</b></span><span>Idle <b>" + (idle / 1000).toFixed(1) + " s</b> (" + stage + ")</span>" +
    "<span>Sentence <b>" + state + "</b></span><span>Edit bursts here <b>" + bursts + "/3</b></span>";
  $("note").textContent = (noteText ? noteText + " " : "") + "Suggestions: " + aiState + (lastMs ? ", last reply " + lastMs + " ms" : "") +
    ". Context sent: outline, current paragraph, cursor sentence.";
}
$("slow").addEventListener("input", e => { slow = +e.target.value; $("slowV").textContent = (slow / 1000).toFixed(2) + " s"; });
$("long").addEventListener("input", e => { long = +e.target.value; $("longV").textContent = (long / 1000).toFixed(1) + " s"; });
$("slowV").textContent = "0.70 s"; $("longV").textContent = "2.5 s";
outline.addEventListener("input", () => { fired = {}; });

setInterval(tick, 100);
render(); hud();
</script>
</body>
</html>
